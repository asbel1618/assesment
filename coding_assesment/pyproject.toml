[project]
name = "coding-assesment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy>=2.1.9",
    "sqlglot>=30.35.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs a real PostgreSQL (DATABASE_URL, READONLY_DATABASE_URL)"]
